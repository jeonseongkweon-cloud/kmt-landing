<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <title>AI 사무국 CONTROL</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="mega-menu.css?v=110">
</head>
<body>
  <header class="topbar"><div class="brand"><strong>AI 사무국 · CONTROL</strong><small id="sessionText">세션 준비 중</small></div><div class="top-actions"><a class="link-button" href="../">홈</a><button id="newSession" class="link-button">새 연결</button></div></header>
  <main class="shell control-home">
    <section class="hero"><div class="status"><span id="displayDot" class="dot"></span><span id="displayStatus">DISPLAY 연결 대기</span></div><h1 id="codeTitle">연결코드 · ------</h1><p>DISPLAY에서 이 코드를 입력하면 바로 연결됩니다.</p></section>
    <div class="search"><input id="searchInput" type="search" placeholder="🔎 전체 자료 검색"></div>
    <section id="searchSection" class="search-results" hidden><div class="section-heading"><h2>검색 결과</h2><button id="clearSearch" class="text-button">닫기</button></div><div id="searchResults" class="quick"></div></section>
    <section><h2>★ 바로 보여주기</h2><div id="favorites" class="quick"></div></section>
    <section class="mega-home"><h2>MEGA MENU</h2><div id="megaRoots" class="mega-root-grid"></div></section>
  <section class="office2-panel" aria-label="AI OFFICE 2.0 빠른 실행"><div class="office2-head"><div><small>AI OFFICE 2.0 · MOBILE CONTROL</small><h2>AI 사무국 업무</h2></div><span>v1.2.0</span></div><p>휴대폰에서 누르면 현재 연결된 DISPLAY에 바로 표시합니다.</p><div id="office2Actions" class="office2-actions"></div></section></main>
  <aside id="megaOverlay" class="mega-overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="megaTitle">
    <div class="mega-panel"><header class="mega-header"><button id="megaBack" class="mega-nav-button" type="button" aria-label="이전 메뉴">← 뒤로</button><div><small>MEGA MENU</small><h2 id="megaTitle">전체 자료</h2></div><button id="megaClose" class="mega-close" type="button" aria-label="메가메뉴 닫기">×</button></header><nav id="megaBody" class="mega-body" aria-label="AI 사무국 메가메뉴"></nav></div>
  </aside>
  <button id="ptt" class="ptt" aria-label="눌러서 말하기">🎙<span>눌러서 말하기</span></button><div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script type="module" src="control.js?v=110"></script>
