<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070b"><title>AI 사무국 자료관리</title><link rel="stylesheet" href="../shared/ui.css"></head><body><header class="topbar"><div class="brand"><strong>AI 사무국 · 자료관리</strong><small>메뉴와 콘텐츠를 직접 추가합니다</small></div><div class="top-actions"><a class="link-button" href="../control/">CONTROL</a><a class="link-button" href="../">홈</a></div></header><main class="shell"><section class="hero"><h1>자료관리실</h1><p>새 자료를 저장하면 CONTROL에 바로 나타납니다.</p></section><section class="panel"><form id="contentForm" class="form-grid"><input id="contentId" type="hidden"><div class="field"><label>제목 *</label><input id="title" required></div><div class="field"><label>짧은 버튼명</label><input id="buttonLabel"></div><div class="field"><label>상위메뉴 *</label><select id="menuId" required></select></div><div class="field"><label>콘텐츠 종류 *</label><select id="contentType"><option>IMAGE</option><option>YOUTUBE</option><option>VIDEO</option><option>WEB</option><option>HOME</option></select></div><div class="field wide"><label>이미지 파일 업로드</label><input id="mediaFile" type="file" accept="image/*,video/mp4,video/webm"></div><div class="field wide"><label>이미지·웹·영상 URL</label><input id="sourceUrl" placeholder="업로드하면 자동 입력됩니다"></div><div class="field"><label>대표 음성명령</label><input id="voiceCommand"></div><div class="field"><label>음성 alias — 쉼표로 구분</label><input id="voiceAliases"></div><div class="field"><label>검색 keyword — 쉼표로 구분</label><input id="keywords"></div><div class="field"><label>표시 순서</label><input id="sortOrder" type="number" value="100"></div><div class="field"><label>전환</label><select id="transition"><option value="FADE">FADE</option><option value="NONE">NONE</option></select></div><div class="field"><label>효과음</label><select id="soundEffect"><option>NONE</option><option>SOFT</option><option>IMPACT</option></select></div><div class="field"><label>배경 분위기</label><select id="backgroundTheme"><option>DARK_GOLD</option><option>NAVY</option><option>LIGHT</option><option>INSPIRATION</option><option>ORGANIZATION</option><option>DEFAULT</option></select></div><div class="field"><label>웹 표시</label><select id="webEmbed"><option value="true">화면 안에서 열기</option><option value="false">새 창 안내</option></select></div><label class="check"><input id="favorite" type="checkbox">즐겨찾기</label><label class="check"><input id="visible" type="checkbox" checked>공개</label><div class="top-actions"><button class="primary" type="submit">자료 저장</button><button id="resetForm" class="link-button" type="button">새 자료</button></div><p id="formMessage"></p></form></section><section class="hero"><div class="top-actions"><h2 style="margin-right:auto">메뉴 관리</h2><button id="addMenu" class="primary">+ 상위메뉴</button></div></section><section id="menuRows" class="panel rows"></section><section class="hero"><h2>콘텐츠 관리</h2></section><section class="panel table"><div id="contentRows" class="rows"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script type="module" src="admin.js"></script></body></html>
