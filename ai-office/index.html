<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070b"><title>AI 사무국</title><link rel="icon" href="favicon.ico?v=20260901"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png?v=20260901"><link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png?v=20260901"><link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=20260901"><link rel="manifest" href="manifest.webmanifest?v=20260901"><link rel="stylesheet" href="shared/ui.css"></head><body>
<main class="shell"><section class="hero"><p style="color:var(--gold)">AI HEADQUARTERS · v1.0</p><h1>AI 사무국</h1><p>휴대폰은 CONTROL, 태블릿·노트북은 DISPLAY로 연결합니다.</p></section>
<section id="loginPanel" class="panel" style="max-width:460px;padding:22px"><h2>관리자 로그인</h2><p style="color:var(--muted)">계명태권도 CLASS와 같은 관리자 아이디·비밀번호를 사용합니다.</p><form id="loginForm" class="form-grid" style="padding:0"><div class="field wide"><label>관리자 아이디</label><input id="loginId" value="admin" autocomplete="username" required></div><div class="field wide"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" type="submit">AI 사무국 입장</button><p id="message" style="color:var(--muted)"></p></form></section>
<section id="launcher" hidden><div class="quick"><a class="command-button" href="control/"><b>📱 CONTROL</b><small>휴대폰 리모컨</small></a><a class="command-button" href="display/"><b>🖥 DISPLAY</b><small>태블릿·노트북 화면</small></a><a class="command-button" href="admin/"><b>⚙ 자료관리</b><small>메뉴·콘텐츠 관리</small></a></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script type="module">import{db,$,cfg}from'./shared/core.js';const panel=$('loginPanel'),launcher=$('launcher');async function show(){const{data:{session}}=await db.auth.getSession();panel.hidden=!!session;launcher.hidden=!session;if(!session)$('password').focus()}$('loginForm').onsubmit=async e=>{e.preventDefault();if($('loginId').value.trim().toLowerCase()!=='admin'){$('message').textContent='아이디 또는 비밀번호를 확인해 주세요.';return}const{error}=await db.auth.signInWithPassword({email:cfg.adminAuthEmail,password:$('password').value});$('message').textContent=error?'아이디 또는 비밀번호를 확인해 주세요.':'로그인되었습니다.';show()};show();</script></body></html>
