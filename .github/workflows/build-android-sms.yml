name: Build CLASS SMS Sender APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-sms-sender/**'
      - '.github/workflows/build-android-sms.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android-sms-sender
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KMT-CLASS-SMS-SENDER-v0.9.0
          path: android-sms-sender/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
