<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071425">
  <meta name="description" content="계명태권도 CLASS SYSTEM 개발기반">
  <title>계명태권도 CLASS SYSTEM</title>
  <link rel="icon" href="../assets/icons/kmt_favicon_48.png">
  <link rel="stylesheet" href="class.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <img src="../assets/icons/192로고.png" alt="계명태권도 로고">
        <div>
          <strong data-app-name>계명태권도 CLASS SYSTEM</strong>
          <span data-stage>WORK 3차 · 원생관리 관리자</span>
        </div>
      </div>
      <div class="top-actions">
        <a class="home-link admin-link" href="admin/">원생관리</a>
        <a class="home-link" data-home-link href="../">홈페이지로</a>
      </div>
    </header>

    <section class="hero" aria-labelledby="class-title">
      <article class="panel intro">
        <p class="eyebrow" data-version>CLASS v0.3.0</p>
        <h1 id="class-title">수업을 더 편하게,<br>성장을 더 즐겁게.</h1>
        <p>Google 관리자 인증으로 보호되는 원생관리 화면에서 68명의 정보와 수업부, 상태, 보호자 자료를 안전하게 관리합니다.</p>
      </article>

      <aside class="panel status" aria-label="개발기반 상태">
        <div>
          <p class="status-label">SYSTEM STATUS</p>
          <p class="status-value"><span class="status-dot" aria-hidden="true"></span>기반 정상</p>
        </div>
        <div class="checks">
          <div class="check">기존 홈페이지 분리 보존</div>
          <div class="check">TV·노트북 반응형 기반</div>
          <div class="check">Google 관리자 로그인</div>
        </div>
      </aside>
    </section>

    <p class="notice"><strong>현재 버전: CLASS v0.3.0</strong> · WORK 3차 원생관리 단계입니다. 관리자만 개인정보를 조회하고 수정할 수 있습니다.</p>
  </main>

  <script src="config.js"></script>
  <script src="class.js"></script>
</body>
</html>
